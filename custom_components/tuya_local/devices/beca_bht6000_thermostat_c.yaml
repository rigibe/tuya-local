name: Beca BHT-6000 Thermostat
products:
  - id: IAYz2WK1th0cMLmL
    manufacturer: Beca
    model: BHT-6000
entities:
  - entity: climate
    dps:
      - id: 1
        type: boolean
        name: hvac_mode
        mapping:
          - dps_val: false
            value: "off"
          - dps_val: true
            constraint: mode
            conditions:
              - dps_val: "0"
                value: auto
              - dps_val: "1"
                value: heat
              - dps_val: null
                value: heat
                hidden: true
      - id: 2
        type: integer
        name: temperature
        unit: C
        range:
          min: 10
          max: 70
        mapping:
          - scale: 2
      - id: 3
        type: integer
        name: current_temperature
        mapping:
          - scale: 2
      - id: 4
        type: string
        name: mode
        optional: true
        hidden: true
      - id: 5
        type: boolean
        name: preset_mode
        mapping:
          - dps_val: true
            value: eco
          - dps_val: false
            value: comfort
  - entity: select
    name: Temperature source
    icon: mdi:thermometer
    category: config
    dps:
      - id: 103
        type: string
        # tempSwitch: 0 = floor sensor, 1 = room sensor.
        # The thermostat keeps reporting the source it is configured for;
        # with no floor probe connected it refuses to switch to 0.
        optional: true
        name: option
        mapping:
          - dps_val: "1"
            value: Room
          - dps_val: "0"
            value: Floor
  - entity: lock
    translation_key: child_lock
    category: config
    dps:
      - id: 6
        type: boolean
        name: lock
  - entity: sensor
    name: Floor temperature
    class: temperature
    hidden: unavailable
    dps:
      - id: 102
        type: integer
        # If dp 104 is false, this may not be present
        optional: true
        name: sensor
        unit: C
        class: measurement
        mapping:
          - scale: 2
      - id: 104
        type: boolean
        # floortempFunction: floor sensor function enabled.
        # Named "available" so the sensor is hidden while the function is off.
        name: available
